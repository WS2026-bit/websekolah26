<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prestasi siswa SIT Al-Ihsan: akademik dan non-akademik, tingkat daerah, nasional, hingga internasional.">
  <meta property="og:title" content="Prestasi — SIT Al-Ihsan">
  <meta property="og:type" content="website">
  <title>Prestasi Siswa — SIT Al-Ihsan</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="prestasi">

  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="page-hero__bg"><img src="https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/db450ccf0659.jpg" alt="" loading="lazy"></div>
      <div class="container">
        <div id="page-breadcrumb"></div>
        <h1>Prestasi Siswa</h1>
        <p>120+ prestasi akademik &amp; non-akademik pada tingkat daerah, nasional, dan internasional.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="flex justify-between items-center flex-wrap gap-2 mb-3">
          <div class="gfilters" id="ach-level" style="margin-bottom:0" role="tablist" aria-label="Filter tingkat">
            <button class="chip active" data-level="all">Semua Tingkat</button>
            <button class="chip" data-level="daerah">Daerah</button>
            <button class="chip" data-level="nasional">Nasional</button>
            <button class="chip" data-level="internasional">Internasional</button>
          </div>
          <div class="field" style="min-width:220px">
            <label class="sr-only" for="ach-type">Jenis prestasi</label>
            <select id="ach-type">
              <option value="all">Semua Jenis</option>
              <option value="akademik">Akademik</option>
              <option value="non-akademik">Non-Akademik</option>
              <option value="keagamaan">Keagamaan</option>
            </select>
          </div>
        </div>
        <div class="grid grid--2" id="ach-grid"></div>
      </div>
    </section>

    <section class="section section--alt">
      <div class="container text-center">
        <span class="eyebrow reveal" style="justify-content:center">Statistik</span>
        <h2 class="section-title reveal">120+ Prestasi &amp; Terus Bertambah</h2>
        <p class="section-desc reveal" style="max-width:560px;margin-inline:auto">Pembinaan intensif klub sains, debat, tahfizh, dan olahraga menjadi jalan siswa Al-Ihsan meraih medali.</p>
        <a href="ppdb.html" class="btn btn--gold btn--lg mt-3 reveal"><i data-lucide="pen-line"></i>Jadikan Anak Anda Bagian Dari Ini</a>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="config/supabase.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/data-seed.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () =>
      Pages.boot({ page: 'prestasi', pageTitle: 'Prestasi', breadcrumb: [{ label: 'Prestasi' }] }));
  </script>
</body>
</html>
