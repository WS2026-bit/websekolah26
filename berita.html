<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Berita terbaru, kegiatan siswa, artikel, dan pengumuman resmi SIT Al-Ihsan.">
  <meta property="og:title" content="Berita &amp; Informasi — SIT Al-Ihsan">
  <meta property="og:type" content="website">
  <title>Berita &amp; Informasi — SIT Al-Ihsan</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="berita">

  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="page-hero__bg"><img src="https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/83885ab79bb2.jpg" alt="" loading="lazy"></div>
      <div class="container">
        <div id="page-breadcrumb"></div>
        <h1>Berita &amp; Informasi</h1>
        <p>Kegiatan sekolah, artikel edukasi, dan pengumuman resmi.</p>
      </div>
    </section>

    <section class="section" id="berita-list">
      <div class="container">
        <div class="flex justify-between items-center flex-wrap gap-2 mb-3">
          <div class="gfilters" id="news-cats" style="margin-bottom:0" role="tablist" aria-label="Kategori berita">
            <button class="chip active" data-cat="all">Semua</button>
          </div>
          <div class="field" style="min-width:240px">
            <label class="sr-only" for="news-search">Cari berita</label>
            <div style="position:relative">
              <input type="search" id="news-search" placeholder="Cari berita…" aria-label="Cari berita">
            </div>
          </div>
        </div>
        <p class="small muted mb-2" id="news-info"></p>
        <div class="grid grid--3" id="news-grid"></div>
        <nav class="pagination" id="news-pagination" aria-label="Navigasi halaman berita"></nav>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="config/supabase.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/data-seed.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () =>
      Pages.boot({ page: 'berita', pageTitle: 'Berita & Informasi', breadcrumb: [{ label: 'Berita' }] }));
  </script>
</body>
</html>
